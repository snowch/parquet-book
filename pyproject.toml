# Python here is the book's Python reader (python/parquet_lab), its problems (exercises/python),
# and the tooling: the fixture generator, the site renderer and the checks. The Rust reader is in
# Cargo.toml.
[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["target", "_build", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Line length is the formatter's job. What it leaves long is a string: prose, or JavaScript.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "python/tests", "exercises/python"]
