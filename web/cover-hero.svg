<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 262" role="img">
  <!-- The cover's picture: a Parquet file as a strip of bytes, first byte on the left. It is drawn
       on its own panel, so it reads the same on the book's light and dark pages, and it carries
       no numbers: the widths are not to scale, and the counts are those of the picture. What it
       says is what ch02 reads by hand: the file opens and closes with the magic, the last bytes
       before the closing magic give the footer's length, and the footer says where every column
       chunk starts. -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#21435f"/>
      <stop offset="1" stop-color="#18334b"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#eef3f6"/>
    </marker>
    <marker id="head-footer" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#cbbbe9"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="260" rx="14" fill="url(#panel)" stroke="#3d6485" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" fill="#dde6ec">
    <!-- What a row group holds. -->
    <g transform="translate(27 22)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#6cb0d9"/>
      <rect x="13" y="0" width="10" height="10" rx="2" fill="#e3a852"/>
      <rect x="26" y="0" width="10" height="10" rx="2" fill="#86c98a"/>
      <text x="44" y="10" font-size="13" fill="#b7cad7">a column chunk per column</text>
    </g>

    <!-- Row groups, bracketed from above. -->
    <path d="M81 86V80H219V86M225 86V80H363V86" fill="none" stroke="#8fa9bd" stroke-width="1.4"/>
    <text x="150" y="72" font-size="14" text-anchor="middle">row group</text>
    <text x="294" y="72" font-size="14" text-anchor="middle">row group</text>
    <text x="51" y="72" font-size="14" text-anchor="middle">magic</text>
    <text x="549" y="72" font-size="14" text-anchor="middle">magic</text>

    <!-- The strip of bytes. -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, 'DejaVu Sans Mono', monospace" font-weight="700">
      <rect x="27" y="92" width="48" height="60" rx="4" fill="#eef3f6"/>
      <text x="51" y="127" font-size="14" text-anchor="middle" fill="#1b3850">PAR1</text>
      <rect x="525" y="92" width="48" height="60" rx="4" fill="#eef3f6"/>
      <text x="549" y="127" font-size="14" text-anchor="middle" fill="#1b3850">PAR1</text>
    </g>
    <g stroke="#18334b" stroke-width="1.2" stroke-opacity=".55">
      <rect x="81" y="92" width="44" height="60" rx="3" fill="#6cb0d9"/>
      <rect x="128" y="92" width="44" height="60" rx="3" fill="#e3a852"/>
      <rect x="175" y="92" width="44" height="60" rx="3" fill="#86c98a"/>
      <rect x="225" y="92" width="44" height="60" rx="3" fill="#6cb0d9"/>
      <rect x="272" y="92" width="44" height="60" rx="3" fill="#e3a852"/>
      <rect x="319" y="92" width="44" height="60" rx="3" fill="#86c98a"/>
      <!-- Page boundaries inside each column chunk. -->
      <path d="M99 94V150M113 94V150M146 94V150M195 94V150M207 94V150M241 94V150M257 94V150M290 94V150M302 94V150M337 94V150"/>
    </g>
    <rect x="369" y="92" width="110" height="60" rx="4" fill="#cbbbe9"/>
    <text x="424" y="127" font-size="15" font-weight="600" text-anchor="middle" fill="#1b3850">footer</text>
    <rect x="482" y="92" width="40" height="60" rx="4" fill="#a9bfcf"/>
    <text x="502" y="126" font-size="12" font-weight="600" text-anchor="middle" fill="#1b3850"
          font-family="ui-monospace, SFMono-Regular, Menlo, 'DejaVu Sans Mono', monospace">len</text>

    <!-- A reader starts at the end: the length leads back to the footer. -->
    <path d="M502 90C502 50 374 50 374 88" fill="none" stroke="#eef3f6" stroke-width="1.6" marker-end="url(#head)"/>
    <text x="573" y="32" font-size="13" text-anchor="end" fill="#eef3f6">read from the end: the length finds the footer</text>

    <!-- The footer says where each column chunk starts. -->
    <g fill="none" stroke="#cbbbe9" stroke-width="1.3" stroke-opacity=".8" marker-end="url(#head-footer)">
      <path d="M410 154C410 238 86 238 86 158"/>
      <path d="M414 154C414 224 133 224 133 158"/>
      <path d="M418 154C418 210 180 210 180 158"/>
      <path d="M422 154C422 196 230 196 230 158"/>
      <path d="M426 154C426 184 277 184 277 158"/>
      <path d="M430 154C430 174 324 174 324 158"/>
    </g>
    <text x="502" y="172" font-size="13" text-anchor="middle" fill="#b7cad7">length</text>
    <text x="250" y="245" font-size="13" text-anchor="middle" fill="#cbbbe9">the footer records where every column chunk starts</text>
  </g>
</svg>
